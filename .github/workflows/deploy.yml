name: Deploy AI Tender Dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 매일 평일 오전 08:30 KST (UTC 23:30) 자동 갱신
  schedule:
    - cron: '30 23 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 전체 파이프라인 단위 테스트 실행
      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v

      # 통합 파이프라인 실행 (API 수집 -> 데이터 가공 -> ai_projects.json 갱신 -> 디스코드 알림)
      - name: Run Full Data Pipeline
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
