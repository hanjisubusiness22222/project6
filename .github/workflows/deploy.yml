name: Deploy AI Tender Dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 매일 평일 오전 08:30 KST (UTC 23:30) 자동 갱신
  schedule:
    - cron: '30 23 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 팀원 1이 main.py를 만들기 전에는 팀원 2의 process_data.py로 fixtures를 가공하여 ai_projects.json 생성
      - name: Run Data Pipeline
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if [ -f "main.py" ]; then
            echo "Running main.py to fetch latest data from data.go.kr..."
            python main.py
          elif [ -f "process_data.py" ] && [ -f "fixtures/sample_tenders.json" ]; then
            echo "Running team member 2's process_data.py with fixtures/sample_tenders.json..."
            python process_data.py --input fixtures/sample_tenders.json --output data/ai_projects.json
          else
            echo "Using existing data/ai_projects.json for dashboard."
          fi

      # 디스코드 알림 전송 (DISCORD_WEBHOOK_URL이 등록되어 있으면 자동 발송)
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify_discord.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
